[package]
name = "sekhmet-config"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Bare-metal Single-Source-of-Truth (SST) YAML configuration parser, validator & canonical generator for Sekhmet"

[dependencies]
sekhmet-sanitize = { path = "../sekhmet-sanitize" }
sekhmet-crypto = { path = "../sekhmet-crypto" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
