[package]
name = "sekhmet-store"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Pristine single-schema SQLite WAL identity, session, API key & Merkle audit store"

[dependencies]
sekhmet-sanitize = { path = "../sekhmet-sanitize" }
sekhmet-crypto = { path = "../sekhmet-crypto" }
sekhmet-cidr = { path = "../sekhmet-cidr" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
