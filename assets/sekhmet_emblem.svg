<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <!--
    SEKHMET (سخمت) — THE POWERFUL ONE
    Universal Sovereign Auth, Identity & Cryptographic Threshold Engine
    Mathematical Construction:
      - Canvas: 1000 x 1000 Cartesian Grid (Center: 500, 500)
      - Golden Ratio (Phi = 1.61803398875) Proportions:
        * Outer Aegis Octagonal Shield Radius: R_0 = 440
        * Solar Disk of Ra (Upper Sanctum): Center (500, 290), R_sun = 136 (440 / Phi^2.5)
        * Geometric Lioness Mane & Jaw: Symmetric polygonal facets anchored at 15-degree radial harmonics
        * Central Ankh-Keyhole Cryptographic Threshold: Bisecting vertical axis X = 500
      - 100% Pure Mathematical Vector Paths: Infinite resolution scaling (16x16 to 16384x16384)
  -->
  <defs>
    <linearGradient id="sekhmet-obsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="50%" stop-color="#06080D" />
      <stop offset="100%" stop-color="#020305" />
    </linearGradient>
    <linearGradient id="sekhmet-solar-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="sekhmet-crimson-flare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
  </defs>

  <!-- 1. Outer Sovereign Beveled Shield Monolith -->
  <polygon
    points="500,40 825,175 960,500 825,825 500,960 175,825 40,500 175,175"
    fill="url(#sekhmet-obsidian)"
    stroke="url(#sekhmet-solar-gold)"
    stroke-width="14"
    stroke-linejoin="miter"
  />
  <polygon
    points="500,72 802,198 928,500 802,802 500,928 198,802 72,500 198,198"
    fill="none"
    stroke="#F59E0B"
    stroke-width="3"
    stroke-opacity="0.45"
  />

  <!-- 2. Solar Disk of Ra & Uraeus Serpent Crown (Sovereign Root Authority) -->
  <circle
    cx="500"
    cy="265"
    r="128"
    fill="none"
    stroke="url(#sekhmet-solar-gold)"
    stroke-width="16"
  />
  <circle
    cx="500"
    cy="265"
    r="98"
    fill="url(#sekhmet-crimson-flare)"
    fill-opacity="0.18"
    stroke="#EF4444"
    stroke-width="3"
    stroke-dasharray="12 8"
  />
  <!-- Uraeus Cobra Hood & Apex -->
  <path
    d="M 500,105 L 542,165 L 522,225 L 500,195 L 478,225 L 458,165 Z"
    fill="url(#sekhmet-solar-gold)"
  />

  <!-- 3. Geometric Lioness Mane & Sentinel Visage (Symmetrical Radial Harmonics) -->
  <!-- Outer Mane Crown Facets -->
  <path
    d="M 500,320
       L 690,260 L 780,420 L 740,630 L 590,820 L 500,885
       L 410,820 L 260,630 L 220,420 L 310,260 Z"
    fill="#0D131F"
    stroke="url(#sekhmet-solar-gold)"
    stroke-width="12"
    stroke-linejoin="miter"
  />
  <!-- Inner Geometric Cheek & Brow Armor Plates -->
  <polygon
    points="500,355 655,310 725,440 685,605 500,490"
    fill="#131C2E"
    stroke="#F59E0B"
    stroke-width="6"
    stroke-linejoin="bevel"
  />
  <polygon
    points="500,355 345,310 275,440 315,605 500,490"
    fill="#131C2E"
    stroke="#F59E0B"
    stroke-width="6"
    stroke-linejoin="bevel"
  />

  <!-- 4. Fierce Solar Eyes of Sekhmet (Zero-Trust Interrogation Sensors) -->
  <polygon
    points="340,430 450,462 425,495 325,465"
    fill="url(#sekhmet-solar-gold)"
  />
  <polygon
    points="660,430 550,462 575,495 675,465"
    fill="url(#sekhmet-solar-gold)"
  />

  <!-- 5. Central Ankh-Keystone Cryptographic Portal (Identity & Key Custody) -->
  <path
    d="M 500,520
       C 555,520 585,565 555,615
       L 532,645
       L 610,645 L 610,685 L 535,685
       L 555,830 L 500,865 L 445,830
       L 465,685 L 390,685 L 390,645
       L 468,645
       L 445,615
       C 415,565 445,520 500,520 Z"
    fill="url(#sekhmet-solar-gold)"
  />
  <!-- Inner Keyhole Void -->
  <circle cx="500" cy="575" r="24" fill="#06080D" />
  <polygon points="488,590 512,590 520,785 480,785" fill="#06080D" />

  <!-- 6. Cardinal Cryptographic Axis Ticks -->
  <line x1="500" y1="40" x2="500" y2="95" stroke="#FFD166" stroke-width="6" />
  <line x1="500" y1="905" x2="500" y2="960" stroke="#FFD166" stroke-width="6" />
  <line x1="40" y1="500" x2="95" y2="500" stroke="#FFD166" stroke-width="6" />
  <line x1="905" y1="500" x2="960" y2="500" stroke="#FFD166" stroke-width="6" />
</svg>
